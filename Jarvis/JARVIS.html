<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pobierz J.A.R.V.I.S</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.08);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #d1d5db;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 20px;
            text-decoration: none;
            color: white;
            background: #0078ff;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #005fcc;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 J.A.R.V.I.S</h1>

    <p>
        Pobierz najnowszą wersję aplikacji J.A.R.V.I.S.
        Kliknij przycisk poniżej, aby rozpocząć pobieranie.
    </p>

    <a href="J.A.R.V.I.S.zip" download class="btn">
        📥 Pobierz aplikację
    </a>

    <div class="footer">
        © 2026 J.A.R.V.I.S
    </div>
</div>

</body>
</html>
